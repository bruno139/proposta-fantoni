<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposta Fantoni PDV</title>
<script>
  // Aplica o tema escolhido antes de desenhar a página, para não piscar.
  try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Cores — tema claro por padrão, escuro segue o Windows a menos que a pessoa escolha no botão do topo */
/* Cores e fontes da Fantoni Software (as mesmas do site fantonisoftware.com.br) */
:root {
  --bg: #f1f5f9; --surface: #fff; --line: #e2e8f0; --text: #1e293b; --muted: #64748b; --raio: 18px;
  --topo: #0f172a; --cor: #1d4ed8; --cor2: #3b82f6; --cor-suave: #eff6ff; --ok: #22c55e; --ambar: #f59e0b;
  --sombra: 0 6px 24px rgba(15, 23, 42, .07);
  --titulo: Outfit, Inter, system-ui, sans-serif;
  --brilho1: #1d4ed8; --brilho2: #2563eb; --botao: #2563eb; --botao-sombra: rgba(37,99,235,.4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) { --bg: #0b1120; --surface: #162033; --line: #24324a; --text: #e2e8f0; --muted: #94a3b8; --topo: #0f172a; --cor: #3b82f6; --cor2: #60a5fa; --cor-suave: #172554; --sombra: none; }
}
:root[data-tema="escuro"] { --bg: #0b1120; --surface: #162033; --line: #24324a; --text: #e2e8f0; --muted: #94a3b8; --topo: #0f172a; --cor: #3b82f6; --cor2: #60a5fa; --cor-suave: #172554; --sombra: none; }
/* Link PRO: mesma página em laranja (como no site de vídeos) */
:root[data-sistema="linkpro"] { --cor: #e8650f; --cor2: #fb8a3c; --cor-suave: #fff1e6; --brilho1: #c2410c; --brilho2: #ea580c; --botao: #ea580c; --botao-sombra: rgba(234,88,12,.4); }
@media (prefers-color-scheme: dark) { :root[data-sistema="linkpro"]:not([data-tema="claro"]) { --cor: #ff8a3d; --cor2: #fdba74; --cor-suave: #3a2416; } }
:root[data-sistema="linkpro"][data-tema="escuro"] { --cor: #ff8a3d; --cor2: #fdba74; --cor-suave: #3a2416; }
.lua { display: none; }
:root[data-tema="claro"] .sol { display: none; }
:root[data-tema="claro"] .lua { display: block; }
:root[data-tema="escuro"] .lua { display: none; }
@media (prefers-color-scheme: light) { :root:not([data-tema]) .sol { display: none; } :root:not([data-tema]) .lua { display: block; } }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, "Segoe UI", sans-serif; transition: background .3s; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* barra do topo */
.barra { background: var(--topo); color: #fff; position: sticky; top: 0; z-index: 20; }
.barra .wrap { height: 74px; display: flex; align-items: center; justify-content: space-between; }
.marca { display: flex; align-items: center; gap: 12px; }
.marca .logo { height: 60px; margin: 0 -6px; width: auto; display: block; }
.marca .sep { width: 1px; height: 30px; background: rgba(255,255,255,.18); }
.marca b { display: block; font-family: var(--titulo); font-weight: 600; font-size: 17px; line-height: 1.2; }
.marca small { display: block; font-size: 12px; opacity: .7; }

/* troca de sistema (clique no nome do topo) */
.sistemas { position: relative; }
.barra .nome-site { gap: 8px; align-items: center; padding: 6px 10px; margin-left: -10px; text-align: left; }
.nome-site .seta { transition: transform .15s; opacity: .85; flex: none; }
.nome-site[aria-expanded="true"] .seta { transform: rotate(180deg); }
.menu-sistemas { position: absolute; top: calc(100% + 10px); left: -10px; z-index: 30; width: 300px; background: var(--surface); color: var(--text); border-radius: 14px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: none; }
.menu-sistemas.aberto { display: block; animation: entra .15s ease; }
.menu-sistemas .rotulo { font-size: 11.5px; color: var(--muted); padding: 4px 10px 6px; text-transform: uppercase; letter-spacing: .5px; }
.menu-sistemas a { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; color: inherit; text-decoration: none; }
.menu-sistemas a:hover { background: var(--bg); }
.menu-sistemas .bola { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; font-family: var(--titulo); }
.menu-sistemas .bola.pdv { background: #1d4ed8; }
.menu-sistemas .bola.linkpro { background: #e8650f; }
.menu-sistemas .n1 { font-weight: 600; font-size: 14.5px; display: block; }
.menu-sistemas .n2 { font-size: 12px; color: var(--muted); display: block; }
.menu-sistemas .atual { margin-left: auto; font-size: 11px; color: var(--cor); font-weight: 600; }

/* parte da proposta ainda sem itens */
.aguardando { background: var(--surface); border: 2px dashed var(--line); border-radius: var(--raio); padding: 22px; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 14px; }
.aguardando .ico { width: 46px; height: 46px; flex: none; border-radius: 13px; background: var(--cor-suave); color: var(--cor); display: grid; place-items: center; }
.aguardando b { display: block; color: var(--text); font-family: var(--titulo); font-size: 16px; font-weight: 600; }
.acoes { display: flex; gap: 4px; }
.barra button { border: 0; background: none; color: #fff; padding: 9px; border-radius: 10px; display: flex; }
.barra button:hover { background: rgba(255,255,255,.14); }

/* abertura */
.hero { position: relative; overflow: hidden; background: var(--topo); color: #fff; padding: 56px 0 90px; }
.hero .wrap { position: relative; }
.bolhas i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: flutua 14s ease-in-out infinite alternate; }
.bolhas i:nth-child(1) { width: 420px; height: 420px; background: var(--brilho1); top: -140px; right: -80px; }
.bolhas i:nth-child(2) { width: 300px; height: 300px; background: var(--brilho2); bottom: -180px; left: 8%; animation-delay: -5s; opacity: .4; }
.bolhas i:nth-child(3) { width: 200px; height: 200px; background: #22c55e; top: 35%; right: 28%; animation-delay: -9s; opacity: .14; }
.grade-fundo { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at 70% 30%, #000 20%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at 70% 30%, #000 20%, transparent 75%); }
@keyframes flutua { to { transform: translate(40px, 30px) scale(1.12); } }
.selo { display: table; font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); padding: 6px 14px; border-radius: 99px; }
.selo i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 1px; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: brilha 2s infinite; }
@keyframes brilha { 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
.hero h1 { font-family: var(--titulo); font-size: clamp(32px, 6vw, 58px); font-weight: 800; margin: 14px 0 4px; letter-spacing: -.8px; line-height: 1.12; }
.hero .data { margin: 0 0 18px; opacity: .7; font-size: 14px; }
.hero .intro { max-width: 680px; margin: 0; opacity: .9; font-size: 15.5px; }

/* telas do sistema em 3D, à direita da abertura */
.telas-3d { display: none; }
.hero.com-telas { min-height: 580px; }
.hero.com-telas .wrap > :not(.telas-3d) { max-width: 47%; position: relative; z-index: 1; }
.hero.com-telas .telas-3d { display: block; position: absolute; top: -24px; right: -70px; width: 60%; height: 470px; perspective: 1600px; }
.tela { position: absolute; margin: 0; width: 84%; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); transform-style: preserve-3d; transition: transform .5s ease; animation: paira 7s ease-in-out infinite alternate; }
.tela img, .tela .vazia { display: block; width: 100%; }
.tela .vazia { aspect-ratio: 16 / 10; }
.tela .vazia { display: grid; place-items: center; background: linear-gradient(135deg, #f8fafc, #e2e8f0); color: #64748b; font-size: 13px; font-weight: 600; }
.janela { display: flex; align-items: center; gap: 5px; padding: 7px 10px; background: #1e293b; color: #cbd5e1; font-size: 11px; font-weight: 600; }
.janela i { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
.janela i:nth-child(2) { background: #f59e0b; }
.janela i:nth-child(3) { background: #22c55e; margin-right: 6px; }
.tela.t3 { top: 0; right: 0; --giro: rotateY(-20deg) rotateX(7deg) translateZ(-120px); transform: var(--giro); z-index: 1; filter: brightness(.7); animation-delay: -4s; }
.tela.t2 { top: 70px; right: 9%; --giro: rotateY(-20deg) rotateX(7deg) translateZ(-50px); transform: var(--giro); z-index: 2; filter: brightness(.85); animation-delay: -2s; }
.tela.t1 { top: 145px; right: 18%; --giro: rotateY(-20deg) rotateX(7deg) translateZ(30px); transform: var(--giro); z-index: 3; }
@keyframes paira { from { transform: var(--giro) translateY(0); } to { transform: var(--giro) translateY(-14px); } }
.telas-3d:hover .tela.t3 { transform: rotateY(-12deg) rotateX(5deg) translateZ(-120px) translateX(30px); }
.telas-3d:hover .tela.t1 { transform: rotateY(-12deg) rotateX(5deg) translateZ(30px) translateX(-30px); }
.cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 26px; background: var(--botao); color: #fff; box-shadow: 0 8px 24px var(--botao-sombra); text-decoration: none; font-weight: 600; padding: 11px 20px; border-radius: 12px; transition: transform .15s; }
.cta:hover { transform: translateY(-2px); }

/* conteúdo + resumo lateral */
.grade { display: grid; grid-template-columns: 1fr 320px; gap: 22px; margin-top: -50px; position: relative; padding-bottom: 60px; }
main { min-width: 0; }
section { margin-bottom: 34px; scroll-margin-top: 80px; }
.titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
.titulo h2 { font-family: var(--titulo); font-size: 22px; font-weight: 700; margin: 0; }
.titulo span { color: var(--muted); font-size: 13px; }
section:first-child .titulo h2, section:first-child .titulo span { color: #fff; }

/* plano base */
.base { background: var(--surface); border-radius: var(--raio); padding: 26px; box-shadow: var(--sombra); display: grid; grid-template-columns: 1fr auto; gap: 20px; border: 2px solid var(--cor); position: relative; overflow: hidden; }
.base::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: linear-gradient(90deg, var(--cor), var(--cor2)); }
.base h3 { margin: 0 0 6px; font-family: var(--titulo); font-size: 21px; font-weight: 700; }
.base p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.base ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.base li { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.base li svg { color: var(--ok); flex: none; }
.suporte { margin-top: 16px; display: flex; gap: 10px; align-items: center; background: var(--cor-suave); color: var(--cor); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 500; }
.acerto { margin-top: 10px; display: flex; gap: 14px; align-items: center; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; }
.acerto b { display: block; font-family: var(--titulo); font-size: 15px; color: #78350f; }
.acerto .dia { flex: none; width: 50px; height: 50px; border-radius: 12px; background: var(--ambar); color: #fff; display: grid; place-content: center; text-align: center; font-family: var(--titulo); font-weight: 800; font-size: 22px; line-height: 1; box-shadow: 0 6px 16px rgba(245,158,11,.35); }
.acerto .dia small { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
.total .dia10 { display: inline-block; margin-top: 6px; font-style: normal; font-size: 12px; font-weight: 600; background: var(--ambar); color: #fff; padding: 3px 10px; border-radius: 99px; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .acerto { background: #2a1f0a; border-color: #78350f; color: #fcd34d; } :root:not([data-tema="claro"]) .acerto b { color: #fde68a; } }
:root[data-tema="escuro"] .acerto { background: #2a1f0a; border-color: #78350f; color: #fcd34d; }
:root[data-tema="escuro"] .acerto b { color: #fde68a; }
.preco-base { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.preco-base .oferta { display: inline-block; font-size: 12px; font-weight: 600; background: var(--ok); color: #fff; padding: 4px 12px; border-radius: 99px; margin-bottom: 10px; box-shadow: 0 4px 14px rgba(34,197,94,.35); }
.regimes { display: flex; flex-direction: column; gap: 8px; width: 210px; }
.regime { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; text-align: left; transition: border-color .2s, background .2s; }
.regime span { font-weight: 600; font-size: 13.5px; grid-column: 1 / -1; color: var(--muted); }
.regime b { font-family: var(--titulo); font-size: 30px; font-weight: 700; letter-spacing: -.6px; line-height: 1.1; }
.regime small { color: var(--muted); font-size: 12px; text-align: right; }
.regime:hover { border-color: var(--cor2); }
.preco-unico { width: 210px; border: 2px solid var(--cor); background: var(--cor-suave); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; text-align: left; }
.preco-unico span { font-weight: 600; font-size: 13.5px; color: var(--cor); }
.preco-unico b { font-family: var(--titulo); font-size: 34px; font-weight: 700; letter-spacing: -.6px; line-height: 1.15; }
.preco-unico small { color: var(--muted); font-size: 12px; }
.preco-unico em { font-style: normal; font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.regime[aria-checked="true"] { border-color: var(--cor); background: var(--cor-suave); }
.regime[aria-checked="true"] span { color: var(--cor); }

/* cards de itens */
.itens { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.item { background: var(--surface); border: 2px solid transparent; border-radius: var(--raio); padding: 18px; text-align: left; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, transform .2s; position: relative; }
.item:hover { transform: translateY(-3px); }
.item.on { border-color: var(--cor); }
.item.obrigatorio { cursor: default; border-color: var(--ok); }
.item.obrigatorio:hover { transform: none; }
.item.obrigatorio .ico { background: var(--ok); color: #fff; }
.selo-obrig { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; background: var(--ok); color: #fff; padding: 3px 10px; border-radius: 99px; }
.item .cab { display: flex; align-items: center; gap: 12px; }
.item .ico { width: 44px; height: 44px; flex: none; border-radius: 13px; background: var(--cor-suave); color: var(--cor); display: grid; place-items: center; transition: background .2s, color .2s; }
.item.on .ico { background: linear-gradient(135deg, var(--cor), var(--cor2)); color: #fff; }
.item h4 { margin: 0; font-family: var(--titulo); font-size: 16.5px; font-weight: 600; line-height: 1.3; flex: 1; }
.item p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1; }
.item .pe { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.item .valor { font-family: var(--titulo); font-weight: 700; font-size: 19px; }
.item .valor small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.chave { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.chave::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.item.on .chave { background: var(--cor); }
.item.on .chave::after { transform: translateX(18px); }
.qtd { display: flex; align-items: center; gap: 4px; background: var(--bg); border-radius: 12px; padding: 3px; }
.qtd button { border: 0; background: var(--surface); width: 30px; height: 30px; border-radius: 9px; font-size: 17px; font-weight: 600; line-height: 1; }
.qtd button:hover { color: var(--cor); }
.qtd span { min-width: 26px; text-align: center; font-weight: 600; }

/* resumo */
.resumo { position: relative; }
.caixa { position: sticky; top: 86px; background: var(--surface); border-radius: var(--raio); padding: 22px; box-shadow: var(--sombra); }
.caixa h3 { margin: 0 0 14px; font-family: var(--titulo); font-size: 17px; font-weight: 700; }
.total { background: linear-gradient(135deg, var(--cor), var(--cor2)); color: #fff; border-radius: 14px; padding: 14px 16px; }
.total span { display: block; font-size: 12.5px; opacity: .85; }
.total b { font-family: var(--titulo); font-size: 32px; font-weight: 700; letter-spacing: -.6px; }
.total small { opacity: .85; margin-left: 3px; }
.total.unico { background: var(--cor-suave); color: var(--text); margin-top: 10px; }
.total.unico b { font-size: 22px; color: var(--cor); }
.total.geral { background: var(--topo); margin-top: 10px; border: 1px solid var(--line); }
.total.geral span small { opacity: .75; font-size: 11px; margin: 0; }
.total.geral b { font-size: 26px; }
.caixa ul { list-style: none; margin: 14px 0 0; padding: 0; font-size: 13.5px; }
.caixa li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); animation: entra .25s ease; }
.caixa li span:last-child { white-space: nowrap; font-weight: 500; }
.caixa li.grupo { border: 0; padding: 12px 0 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); animation: none; }
@keyframes entra { from { opacity: 0; transform: translateX(-6px); } }
.dica { margin: 14px 0 0; font-size: 12.5px; color: var(--muted); }
.pulsa { animation: pulsa .35s ease; }
@keyframes pulsa { 50% { transform: scale(1.06); } }

.rodape { padding: 26px 0 36px; color: var(--muted); font-size: 13px; text-align: center; border-top: 1px solid var(--line); }

/* entrada ao rolar */
.surge { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
.surge.visivel { opacity: 1; transform: none; }

@media (max-width: 900px) {
  .hero.com-telas { min-height: 0; }
  .hero.com-telas .wrap > :not(.telas-3d) { max-width: none; }
  .hero.com-telas .telas-3d { position: relative; top: 0; right: 0; width: 100%; height: clamp(230px, 62vw, 470px); margin-bottom: 10px; order: -1; }
  .hero.com-telas .wrap { display: flex; flex-direction: column; align-items: flex-start; }
  .hero.com-telas { padding-top: 28px; }
  .hero.com-telas .telas-3d { align-self: stretch; }
  /* pilha centralizada e menos inclinada: a da frente à esquerda, as de trás aparecendo à direita */
  .tela { width: 80%; right: auto; }
  .tela.t3 { top: 0; left: 18%; --giro: rotateY(-12deg) rotateX(5deg) translateZ(-80px); }
  .tela.t2 { top: 9%; left: 10%; --giro: rotateY(-12deg) rotateX(5deg) translateZ(-35px); }
  .tela.t1 { top: 19%; left: 2%; --giro: rotateY(-12deg) rotateX(5deg) translateZ(20px); }
  .grade { grid-template-columns: 1fr; }
  .resumo { position: sticky; bottom: 0; z-index: 15; margin: 0 -20px -60px; }
  .caixa { position: static; border-radius: var(--raio) var(--raio) 0 0; padding: 14px 18px; box-shadow: 0 -6px 24px rgba(0,0,0,.12); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .caixa h3, .caixa ul, .dica { display: none; }
  .total.unico { margin: 0; }
  .total.geral { grid-column: 1 / -1; margin: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
  .total.geral b { font-size: 20px; }
  .total b { font-size: 22px; }
  .total .dia10 { display: block; width: fit-content; margin-top: 4px; font-size: 11px; padding: 2px 8px; }
  .total.unico b { font-size: 18px; }
}
@media (max-width: 600px) {
  .dica-troca, .marca .sep { display: none; }
  .marca { gap: 8px; }
  .menu-sistemas { position: fixed; top: 70px; left: 16px; right: 16px; width: auto; }

const real = (v) => (v == null ? "A definir" : "R$ " + v.toLocaleString("pt-BR"));
const ICONES = {

// Estado da proposta aberta; render() refaz tudo ao trocar de sistema.
let sistema, P, b, GRUPOS, TODOS, regime, escolha;

function render(id) {
  sistema = PROPOSTAS[id] ? id : "pdv";

  b = P.base;
  document.documentElement.dataset.sistema = sistema;

  // Grupos de itens escolhíveis. "mensal" decide em qual total o valor entra.

  ];

  regime = b.regimes ? b.regimes[0] : { id: "unico", nome: "", preco: b.preco };

    ).join("");

  let html = `
<section id="base">
  <div class="titulo"><h2>Plano Base</h2><span>Já incluso na proposta</span></div>
  <div class="base">
    <div>
      <h3>${b.nome}</h3>
      <p>${b.texto}</p>
      ${b.itens.length ? `<ul>${b.itens.map((i) => `<li>${svg("ok", 18)}${i}</li>`).join("")}</ul>` : ""}
      <div class="suporte">${svg("relogio", 20)}${b.suporte}</div>
      <div class="acerto"><span class="dia"><small>dia</small>10</span><span><b>Acerto mensal</b>${P.acerto}</span></div>
    </div>
    <div class="preco-base">
      <span class="oferta">Para iniciar só com o sistema</span>
      ${b.regimes ? `<div class="regimes" role="radiogroup" aria-label="Regime da empresa">
        ${b.regimes.map((r) => `<button class="regime" role="radio" data-regime="${r.id}"><span>${r.nome}</span><b>${real(r.preco)}</b>${r.preco == null ? "" : "<small>por mês</small>"}</button>`).join("")}
      </div>` : `<div class="preco-unico"><span>Mensalidade única</span><b>${real(b.preco)}</b>${b.preco == null ? "" : "<small>por mês</small>"}${b.nota ? `<em>${b.nota}</em>` : ""}</div>`}
    </div>
  </div>
</section>`;

  for (const g of GRUPOS) {
    html += `<section id="${g.id}"><div class="titulo"><h2>${g.titulo}</h2><span>${g.sub}</span></div>`;
    if (!g.itens.length) {
      html += `<div class="aguardando"><span class="ico">${svg("relogio", 24)}</span><span><b>Itens em definição</b>Os itens e valores desta parte entram aqui em breve.</span></div></section>`;
      continue;
    }
    html += `<div class="itens">`;
    for (const i of g.itens) {
      const sufixo = i.preco == null ? "" : i.tipo === "qtd" ? ` <small>/ ${i.unidade}${g.mensal ? " /mês" : ""}</small>` : g.mensal ? " <small>/mês</small>" : "";
      html += `
    <div class="item${i.obrigatorio ? " obrigatorio" : ""}" data-id="${i.id}" ${i.obrigatorio ? "" : 'role="button" tabindex="0" aria-pressed="false"'}>
      ${i.obrigatorio ? `<span class="selo-obrig">${svg("cadeado", 13)}Obrigatório para iniciar</span>` : ""}
      <div class="cab"><span class="ico">${svg(i.icone)}</span><h4>${i.nome}</h4>${i.tipo === "qtd" || i.obrigatorio ? "" : '<span class="chave"></span>'}</div>
      <p>${i.texto}</p>
      <div class="pe"><span class="valor">${real(i.preco)}${sufixo}</span>
        ${i.tipo === "qtd" ? `<span class="qtd"><button data-d="-1" aria-label="Menos">−</button><span>0</span><button data-d="1" aria-label="Mais">+</button></span>` : ""}
      </div>
    </div>`;
    }
    html += `</div></section>`;
  }
  $("#conteudo").innerHTML = html;
  atualizar();

  // cards aparecem ao rolar
  document.querySelectorAll(".titulo, .base, .item, .aguardando").forEach((el, n) => {
    el.classList.add("surge");
    el.style.transitionDelay = (n % 2) * 80 + "ms";
    obs.observe(el);
  });
}

// --- interação ---
function alternar(id, delta) {
  const i = TODOS[id];
  if (i.obrigatorio) return; // implantação e treinamento: sempre incluso
  if (i.tipo === "qtd") {
    const q = (escolha[id] || 0) + (delta ?? 1);
    if (q > 0) escolha[id] = q; else delete escolha[id];
  } else if (escolha[id]) delete escolha[id];
  else escolha[id] = 1;
  atualizar();
}

$("#conteudo").addEventListener("click", (e) => {
  const bt = e.target.closest(".regime");
  if (bt) { regime = b.regimes.find((r) => r.id === bt.dataset.regime); atualizar(); return; }
  const card = e.target.closest(".item");
  if (!card) return;
  const mais = e.target.closest(".qtd button");
  alternar(card.dataset.id, mais ? Number(mais.dataset.d) : undefined);
});
$("#conteudo").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("item")) { e.preventDefault(); alternar(e.target.dataset.id); }
});

// número que "corre" até o valor novo
const atual = { mensal: 0, unico: 0, geral: 0 };
function animarNumero(el, chave, alvo) {
  const de = atual[chave];
  atual[chave] = alvo;
  if (de === alvo) return;
  el.classList.remove("pulsa"); void el.offsetWidth; el.classList.add("pulsa");
  const ini = performance.now();
  const passo = (t) => {
    const p = Math.min(1, (t - ini) / 450);
    el.textContent = real(Math.round(de + (alvo - de) * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
  // se a animação não rodar (aba em segundo plano), o valor final aparece mesmo assim
  setTimeout(() => { if (atual[chave] === alvo) el.textContent = real(alvo); }, 500);
}

function atualizar() {
  document.querySelectorAll(".regime").forEach((el) => el.setAttribute("aria-checked", el.dataset.regime === regime.id));
  let mensal = regime.preco || 0, unico = 0;
  const linhas = { m: [`<li><span>${b.nome}${regime.nome ? " · " + regime.nome : ""}</span><span>${real(regime.preco)}</span></li>`], u: [] };
  document.querySelectorAll(".item").forEach((card) => {
    const id = card.dataset.id, i = TODOS[id], q = escolha[id] || 0;
    card.classList.toggle("on", q > 0);
    if (!i.obrigatorio) card.setAttribute("aria-pressed", q > 0);
    const n = card.querySelector(".qtd span");
    if (n) n.textContent = q;
    if (!q) return;
    const v = i.preco == null ? null : i.preco * q;
    if (i.mensal) mensal += v || 0; else unico += v || 0;
    const nome = i.tipo === "qtd" ? `${i.nome} (${q} ${i.unidade}${q > 1 ? (i.unidade === "hora" ? "s" : "") : ""})` : i.nome;
    (i.mensal ? linhas.m : linhas.u).push(`<li><span>${nome}</span><span>${real(v)}</span></li>`);
  });
  animarNumero($("#t-mensal"), "mensal", mensal);
  animarNumero($("#t-unico"), "unico", unico);
  animarNumero($("#t-geral"), "geral", mensal + unico);
  $("#lista").innerHTML =
    '<li class="grupo">Mensal</li>' + linhas.m.join("") +
    (linhas.u.length ? '<li class="grupo">Pagamento único</li>' + linhas.u.join("") : "");
}
// troca de sistema: clique no nome do topo abre o menu; o endereço (#pdv / #linkpro) guarda a escolha
const botaoSistema = $("#nome-site"), menu = $("#menu-sistemas");
function abrirMenu(aberto) { menu.classList.toggle("aberto", aberto); botaoSistema.setAttribute("aria-expanded", aberto); }
botaoSistema.addEventListener("click", (e) => { e.stopPropagation(); abrirMenu(!menu.classList.contains("aberto")); });
document.addEventListener("click", (e) => { if (!menu.contains(e.target)) abrirMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") abrirMenu(false); });
menu.addEventListener("click", () => abrirMenu(false));
addEventListener("hashchange", () => { render(location.hash.slice(1)); scrollTo({ top: 0 }); });

const obs = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && (e.target.classList.add("visivel"), obs.unobserve(e.target))), { threshold: 0.1 });
render(location.hash.slice(1));

// tema claro/escuro e impressão
$("#tema").addEventListener("click", () => {
  const raiz = document.documentElement;
  const escuroAgora = raiz.dataset.tema ? raiz.dataset.tema === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches;
  raiz.dataset.tema = escuroAgora ? "claro" : "escuro";
  try { localStorage.setItem("tema", raiz.dataset.tema); } catch (e) {}
});
$("#imprimir").addEventListener("click", () => window.print());
</script>
