<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposta Fantoni PDV</title>
<script>
  // Aplica o tema escolhido antes de desenhar a página, para não piscar.
  try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="barra">
  <div class="wrap">
    <div class="marca">
      <img class="logo" src="logo.webp" alt="Fantoni Software"><span class="sep"></span>
      <div class="sistemas">
        <button class="nome-site" id="nome-site" aria-haspopup="true" aria-expanded="false" title="Trocar de sistema">
          <span><b id="nome-sistema">Fantoni PDV</b><small>Proposta comercial<span class="dica-troca"> · trocar sistema</span></small></span>
          <svg class="seta" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <nav class="menu-sistemas" id="menu-sistemas"></nav>
      </div>
    </div>
    <div class="acoes">
      <button id="tema" title="Alternar fundo claro / escuro">
        <svg class="sol" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="lua" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="imprimir" title="Imprimir ou salvar em PDF">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
      </button>
    </div>
  </div>
</div>

<header class="hero">
  <div class="bolhas"><i></i><i></i><i></i></div>
  <div class="grade-fundo"></div>
  <div class="wrap">
    <div class="telas-3d" id="telas" aria-hidden="true"></div>
    <span class="selo"><i></i>Proposta comercial</span>
    <h1 id="titulo">Fantoni PDV</h1>
    <p class="data" id="data"></p>
    <p class="intro" id="intro"></p>
    <a class="cta" href="#base">Ver a proposta
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </a>
  </div>
</header>

<div class="wrap grade">
  <main id="conteudo"></main>
  <aside class="resumo" id="resumo">
    <div class="caixa">
      <h3>Seu investimento</h3>
      <div class="total"><span>Mensal</span><b id="t-mensal">R$ 0</b><small>/mês</small><em class="dia10" id="acerto-curto">Acerto todo dia 10</em></div>
      <div class="total unico"><span>Pagamento único</span><b id="t-unico">R$ 0</b></div>
      <div class="total geral"><span>Valor total <small>(mensal + pagamento único)</small></span><b id="t-geral">R$ 0</b></div>
      <ul id="lista"></ul>
      <p class="dica">Toque nos cards para incluir ou tirar itens da proposta.</p>
    </div>
  </aside>
</div>

<footer class="rodape"><div class="wrap" id="rodape"></div></footer>

<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
